name: Build & Publish APK (Debug & Release)

on:
  push:
    tags:
      - '*'

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug
          ./gradlew :apptv:assembleDebug

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :apptv:assembleRelease

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk app-release.apk
          cp apptv/build/outputs/apk/debug/apptv-debug.apk apptv-debug.apk
          cp apptv/build/outputs/apk/release/apptv-release.apk apptv-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            app-debug.apk
            app-release.apk
            apptv-debug.apk
            apptv-release.apk