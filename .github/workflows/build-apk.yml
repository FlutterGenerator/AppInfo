name: AppInfo Build

permissions:
  contents: write

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [debug, release]
        module: [app, apptv]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :${{ matrix.module }}:assemble${{ matrix.build_type }} --warning-mode all

      - name: Upload Gradle Problem Report
        uses: actions/upload-artifact@v7
        with:
          name: gradle-problem-report-${{ matrix.module }}-${{ matrix.build_type }}-${{ github.run_id }}
          path: '**/build/reports/problems/'
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}-apk-${{ matrix.build_type }}-${{ github.run_id }}
          path: ${{ matrix.module }}/build/outputs/apk/${{ matrix.build_type }}/${{ matrix.module }}-${{ matrix.build_type }}.apk
          if-no-files-found: error